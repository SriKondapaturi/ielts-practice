<script>
/* Remove the retired offline worker and its caches before anything else loads; reload once so the page comes straight from the server. */
(function(){try{if(!("serviceWorker" in navigator))return;navigator.serviceWorker.getRegistrations().then(function(rs){if(!rs.length)return;return Promise.all(rs.map(function(r){return r.unregister();})).then(function(){return window.caches?caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}):null;}).then(function(){if(navigator.serviceWorker.controller&&!sessionStorage.getItem("ielts_sw_reloaded")){sessionStorage.setItem("ielts_sw_reloaded","1");location.reload();}});}).catch(function(){});}catch(e){}})();
</script>
